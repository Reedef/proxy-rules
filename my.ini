[custom]
;=====================================================================
; 个人定制配置 (基于 ACL4SSR / 方案B 精简版)
; 特性: 按地区分组 + 独立 AI 组 + 标准去广告
;
; 官方规则用 ACL4SSR 的在线 raw 地址(自动同步官方更新),
; 个人规则(MyProxy/MyDirect)指向你自己的仓库。
;=====================================================================

;--------------------------- 规则加载 (从上到下, 先命中先生效) ---------------------------

; [个人规则] 放最前面, 优先级最高
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Reedef/proxy-rules/main/rules/MyDirect.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Reedef/proxy-rules/main/rules/MyProxy.list

; [直连类] 局域网 / 解封白名单
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; [去广告] 标准: BanAD + 应用净化
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; [直连类] 谷歌中国 / Steam中国
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; [AI 服务] 独立分组, 复用官方 AI 规则集
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Claude.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Gemini.list

; [微软 / 苹果 分流]
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; [代理类] 国外媒体 / 电报 / GFW名单
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

; [直连类] 中国大陆域名 / 中国公司IP
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; [兜底] 中国IP直连, 其余走漏网之鱼
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

;--------------------------- 策略组定义 ---------------------------

; 主入口: 汇总所有地区组 + 自动/手动 + 直连
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇨🇳 台湾`[]DIRECT`.*

; 全局自动测速(所有节点里选最快)
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 各地区自动测速组 (正则筛选对应地区节点; 若你的机场节点名不含这些关键字, 该组会为空)
custom_proxy_group=🇭🇰 香港`url-test`(?i)(香港|HK|Hong ?Kong|🇭🇰)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(?i)(日本|JP|Japan|东京|大阪|🇯🇵)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)(美国|US|United ?States|洛杉矶|圣何塞|🇺🇸)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(新加坡|SG|Singapore|狮城|🇸🇬)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 台湾`url-test`(?i)(台湾|台灣|TW|Taiwan|🇹🇼)`http://www.gstatic.com/generate_204`300,,50

; 业务分组: 手动可切换到任意地区
custom_proxy_group=🤖 AI服务`select`[]🇺🇸 美国`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇭🇰 香港`[]🚀 节点选择`.*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🇭🇰 香港`[]🇯🇵 日本`[]🇺🇸 美国`[]🇸🇬 新加坡`[]🇨🇳 台湾`[]♻️ 自动选择`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🇸🇬 新加坡`[]🇭🇰 香港`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*

;--------------------------- 转换器开关 ---------------------------
enable_rule_generator=true
overwrite_original_rules=true
